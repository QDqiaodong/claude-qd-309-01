spring:
  datasource:
    url: jdbc:h2:mem:carwash;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: 127.0.0.1
      port: 65000
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
